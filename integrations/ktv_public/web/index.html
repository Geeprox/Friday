<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Friday KTV</title><link rel="stylesheet" href="./style.css?v=29"><script src="./guide.js?v=24" defer></script><script src="./party-audio.js?v=26" defer></script><script src="./add-queue.js?v=24" defer></script><script src="./status-feed.js?v=25" defer></script><script src="./app.js?v=35" defer></script></head>
<body data-theme="content">
<header class="hero"><div class="hero-art" aria-hidden="true"></div><div class="topline"><a class="brand" href="./" aria-label="Friday KTV 首页"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 12v4M10 6v16M16 2v24M22 8v12"/></svg><span>Friday KTV</span></a><button id="settings-button" class="icon-button" aria-label="房间设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg></button></div><div class="identity-line"><button id="profile-button" class="identity-button" aria-label="修改昵称和头像"><span id="my-avatar" class="avatar" aria-hidden="true"></span><span class="identity-copy"><span class="identity-label">今晚的你</span><strong id="my-name">等待扫码</strong></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><button id="queue-tab" class="queue-entry" type="button">已点 <span id="queue-count">0</span><span aria-hidden="true"> ›</span></button></div></header>
<main id="main"><div id="page-heading" class="page-heading" hidden><button id="page-back" type="button" aria-label="返回上一页">‹</button><h1 id="page-title" tabindex="-1">搜索</h1><button id="view-queue" class="header-queue" type="button" hidden><span id="search-queue-count">已点 0 首</span><span aria-hidden="true">›</span></button></div><div id="home-search-actions" class="home-search-actions"><button id="search-entry" class="search-entry" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><span>搜索歌曲或歌手</span></button><button id="frequent-entry" class="queue-entry frequent-entry" type="button" hidden><span>常唱歌曲</span><span aria-hidden="true">›</span></button></div><form id="search" role="search" hidden><label class="sr-only" for="query">搜索歌曲或歌手</label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="query" type="search" placeholder="搜索歌曲或歌手" autocomplete="off" maxlength="120"><button type="submit">搜索</button></form>
<div id="source-picker" class="source-picker" role="group" aria-label="搜索音源" hidden><button id="source-song" type="button" aria-pressed="true">曲库</button><button id="source-mv" type="button" aria-pressed="false">MV</button><button id="source-cloud" type="button" aria-pressed="false">音乐云盘</button></div>

<p id="connection-status" role="status" aria-live="polite" hidden></p><div id="message" role="status" aria-live="polite"></div><details id="pending-adds" class="pending-adds" hidden><summary id="pending-adds-title">待加入</summary><p id="pending-adds-note"></p><ul id="pending-adds-list"></ul></details><section id="discover" hidden aria-label="点歌推荐"><div class="section-heading"><h2>常唱歌手</h2></div><div id="artist-picker" class="artist-picker"></div><div class="section-heading"><h2>KTV 歌单</h2><button id="refresh-discover" type="button">换一批</button></div><div id="playlist-picker" class="playlist-picker"></div><p id="discover-status" role="status"></p></section><div class="list-heading"><h2 id="list-title">选一首喜欢的</h2><span id="count"></span></div><div id="results"></div><div id="search-page-end" aria-hidden="true" hidden></div><p id="page-progress" role="status" hidden></p><button id="load-more" type="button" class="load-more" hidden>加载更多</button><p id="empty" class="empty">扫描电视上的二维码，加入本场歌单。</p><p id="hint" class="hint"></p></main>
<aside id="player" class="player" aria-label="演唱控制" hidden><div class="player-main"><button id="play-toggle" class="transport" aria-label="播放">▶</button><div class="player-track"><span id="now-title">等待开唱</span><span id="player-status">电视连接后可控制</span></div><button id="restart-button" class="transport" type="button" aria-label="从头重唱" title="从头重唱"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10a9 9 0 1 1 2.2 8.2M3 4v6h6"/></svg></button><button id="skip-button" class="transport" aria-label="切到下一首"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 10 7-10 7ZM19 5v14"/></svg></button></div><div class="player-actions"><button id="sound-button" type="button" aria-label="打开歌曲声音">歌曲声音</button><button id="atmosphere-button" type="button" aria-label="打开鼓掌和喝彩">氛围</button></div></aside>
<dialog id="sound-dialog" aria-labelledby="sound-title"><form method="dialog" class="sheet"><div class="sheet-heading"><h2 id="sound-title" tabindex="-1" autofocus>歌曲声音</h2><button class="icon-button" aria-label="关闭歌曲声音">×</button></div><div class="sound-fields"><div class="backing-mode" role="group" aria-label="演唱音轨" aria-describedby="sound-mode-status"><button id="mode-instrumental" type="button" aria-pressed="true">伴奏</button><button id="mode-original" type="button" aria-pressed="false">原唱</button></div><p id="sound-mode-status" role="status"></p><div class="volume-heading"><label for="music-volume">音乐</label><output id="music-value" for="music-volume">70%</output><span id="music-mute-state" class="sr-only" role="status">等待电视确认</span></div><div class="volume-control" role="group" aria-label="音乐音量"><button id="music-mute-button" class="volume-mute" type="button" aria-label="音乐静音" aria-pressed="mixed" aria-describedby="music-mute-state" data-muted="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="mute-slash" d="m3 3 18 18"/></svg></button><button id="music-minus" type="button" aria-label="音乐音量降低 10%">−</button><input id="music-volume" type="range" min="0" max="100" step="1" value="70"><button id="music-plus" type="button" aria-label="音乐音量提高 10%">＋</button></div><section class="ear-guide" aria-label="耳边伴唱"><div class="guide-heading"><div><h3>耳边伴唱</h3><p>手机听原唱，电视播伴奏</p></div><button id="guide-toggle" type="button" aria-label="开启耳边伴唱" aria-pressed="false">开启</button></div><div id="guide-settings" hidden><div class="guide-volume-row"><label for="guide-volume">伴唱音量</label><input id="guide-volume" type="range" min="0" max="100" value="35"></div><div class="guide-actions"><details class="guide-fine"><summary>手动微调</summary><div class="guide-offset" role="group" aria-label="伴唱同步微调"><button id="guide-delay" type="button" aria-label="伴唱延后 50 毫秒">−50ms</button><output id="guide-offset">0 ms</output><button id="guide-advance" type="button" aria-label="伴唱提前 50 毫秒">＋50ms</button></div></details></div></div><p id="guide-status" role="status"></p></section></div><div class="sound-footer"><p id="sound-error" role="alert"></p></div></form></dialog>

<dialog id="atmosphere-dialog" aria-labelledby="atmosphere-title"><form method="dialog" class="sheet"><div class="sheet-heading"><h2 id="atmosphere-title" tabindex="-1" autofocus>氛围</h2><button class="icon-button" aria-label="关闭氛围控制">×</button></div><section class="atmosphere-card" aria-label="现场氛围"><div class="sfx-actions" role="group" aria-label="氛围音效"><button id="sfx-applause" type="button">鼓掌</button><button id="sfx-cheer" type="button">喝彩</button><button id="sfx-stop" type="button">停止</button></div><p id="sfx-status" class="setting-note" role="status" aria-live="polite">等待电视连接</p><label for="sfx-volume">氛围音量 <output id="sfx-value">60%</output></label><div class="volume-control" role="group" aria-label="氛围音量"><button id="sfx-minus" type="button" aria-label="氛围音量降低 10%">−</button><input id="sfx-volume" type="range" min="0" max="100" step="1" value="60"><button id="sfx-plus" type="button" aria-label="氛围音量提高 10%">＋</button></div><p id="sfx-error" role="alert"></p></section></form></dialog>
<dialog id="song-dialog" aria-labelledby="song-action-title"><form method="dialog" class="sheet"><div class="sheet-heading"><h2 id="song-action-title" tabindex="-1" autofocus>调整歌曲</h2><button class="icon-button" aria-label="关闭歌曲操作">×</button></div><div class="song-actions"><button id="sing-now" type="button">现在唱</button><button id="move-top" type="button">置顶</button><button id="retry-song" type="button">重试</button><button id="find-song-version" type="button">找其他版本</button></div><p id="song-error" role="alert"></p></form></dialog>
<div id="action-progress" class="sr-only" role="status" aria-live="polite" hidden><span id="action-progress-text"></span></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="profile-dialog" aria-labelledby="profile-title"><form method="dialog" class="sheet"><div class="sheet-heading"><h2 id="profile-title" tabindex="-1" autofocus>今晚怎么称呼你</h2><button class="icon-button" aria-label="关闭个人资料">×</button></div><label for="nickname">昵称</label><input id="nickname" maxlength="24" autocomplete="nickname"><div id="avatar-picker" class="avatar-picker" role="group" aria-label="选择头像"></div><div class="sheet-actions"><button id="random-profile" type="button" class="secondary">换一个</button><button id="save-profile" type="button" class="primary">保存</button></div><p id="profile-error" role="alert"></p></form></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><form method="dialog" class="sheet"><div class="sheet-heading"><h2 id="settings-title" tabindex="-1" autofocus>房间风格</h2><button class="icon-button" aria-label="关闭房间设置">×</button></div><p class="setting-note">选择电视上的演唱背景。</p><div id="theme-picker" class="theme-picker"></div><p id="theme-error" role="alert"></p></form></dialog>
</body></html>
