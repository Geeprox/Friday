[project]
name = "friday-portable-review"
version = "0.1.0"
description = "Friday 可选的离线 CPU 视觉复核环境"
requires-python = ">=3.12,<3.14"
dependencies = ["torch==2.15.0", "transformers==5.22.2", "pillow==13.0.0", "pydantic==2.12.3"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
