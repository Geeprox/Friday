<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday · 座位指认</title>
<link rel="stylesheet" href="/assets/index.css">
<body><header><div><h1>Friday · 座位指认</h1><div class="muted">实时骨架 / 手部 / 座位目标</div></div><span id="status">连接中</span></header>
<main><section><div class="stage"><canvas id="video" width="1920" height="1080"></canvas><div class="empty" id="empty">等待实时画面</div><div id="stamp" class="stamp"></div></div>
<div class="below"><canvas class="hand" id="hand" width="640" height="280"></canvas><div class="callout"><h2>指认目标</h2><div class="target pulse" id="target">等待指认</div><div class="progress"><i id="hold"></i></div><div class="muted" id="hint">伸出食指，持续指向约 1 秒</div><div class="metrics" id="metrics"></div></div></div></section>
<aside><div class="maptitle"><strong>玩家位置</strong><span class="muted" id="registration">背景匹配中</span></div><canvas id="map" width="600" height="850"></canvas><div class="note" id="mapnote">相对坐标 · 等待标定状态</div><div class="toolbar"><button class="primary" id="edit" data-click="edit()">校准点位与座位</button><button data-click="document.documentElement.requestFullscreen?.()">全屏</button><button data-click="control('seats_reset')">重新排座</button><button data-click="control('stop')">停止</button><button data-click="control('start')">重连</button></div>
<div class="note"><label>镜头 <select id="cameraMode" aria-label="镜头控制模式" data-change="cameraMode(this.value)"><option value="auto">自动搜索与停留</option><option value="hold">停留当前视角</option><option value="survey">搜索一轮后停留</option></select></label><div id="cameraStatus">正在连接镜头</div></div><div class="editor" id="editor"><div>画面已冻结。选中标记，分别点击画面与户型中的对应位置。</div><label><input id="autoSeats" type="checkbox" checked data-change="toggleAutoSeats()"> 按当前玩家自动锚定</label><label>标记 <select id="object"></select></label><label>座位数 <input id="seatCount" type="number" min="2" max="12" value="6" data-change="resizeSeats()"></label><div>地面锚点应分散，使用墙脚或桌脚接地点；座位标在人体躯干处。</div><div class="toolbar"><button class="primary" data-click="save()">保存相对标定</button><button data-click="cancel()">取消</button></div><div id="editerror"></div></div>
</aside></main><footer>本机识别 · 不保存录像 · 指认基于单视角几何，重合目标保持待确认</footer>
<script defer src="/assets/index.js"></script></body></html>
