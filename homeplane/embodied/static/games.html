<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday · 家庭游戏</title><link rel="stylesheet" href="/assets/games.css"></head>
<body>
<p id="sourceMode" class="source-mode" hidden>示例游戏 · simulated</p>
<header class="stage-header">
  <div class="stage-brand"><img src="/assets/friday-icon.png" width="28" height="28" alt=""><h1>Friday 游戏</h1></div>
  <nav aria-label="游戏模式"><button aria-pressed="true" data-mode="quest" data-click="chooseMode('quest')">山径冒险</button><button aria-pressed="false" data-mode="ski" data-click="chooseMode('ski')">林间滑雪</button><button aria-pressed="false" data-mode="tennis" data-click="chooseMode('tennis')">双人网球</button><button aria-pressed="false" data-mode="hiit" data-click="chooseMode('hiit')">运动训练</button></nav>
  <span class="connection" id="connection" role="status" aria-live="polite" aria-atomic="true">正在连接</span>
</header>
<main class="workspace">
  <canvas id="world" aria-label="体感游戏画面"></canvas>
  <figure id="gameTutorial" class="game-tutorial" hidden></figure>
  <div class="hud"><div class="mission-block"><span id="chapter" hidden></span><h2 class="mission" id="mission">双臂平举，打开林间入口</h2><p class="instruction" id="instruction">让全身入镜，跟随动作完成挑战。</p><p class="live-progress" id="liveProgress" hidden></p><div class="bar" role="progressbar" aria-label="本局进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div><ol id="questTrail" class="quest-trail" aria-label="山径路线"></ol><p id="questAnnouncement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p></div><div class="score" id="score">0 / 8<small>完成站点</small></div></div>
  <aside class="debug" id="playerView" aria-label="我的动作画面" hidden><header>我的动作</header><canvas id="debugVideo" width="640" height="360" aria-label="玩家摄像头画面"></canvas><div class="metrics" id="debugMetrics"></div></aside>
  <section class="overlay" id="overlay" aria-live="polite"><h2>用身体走完这段山径</h2><p>全身入镜，比出 OK 开始。</p><button class="primary" data-click="startGame()">开始本局</button></section>
  <div class="bottom"><div class="player-feedback"><p class="input" id="input">让双脚与双手完整入镜</p><p class="live" id="feedback" role="status" aria-live="polite" aria-atomic="true"></p><p id="tennisEvent" class="tennis-event" role="status" aria-live="polite" aria-atomic="true" hidden></p><span class="live" id="camera">等待镜头就绪</span></div>
    <div class="actions"><span id="gameNotice" role="status"></span><button id="pauseToggle" data-click="pauseGame()" hidden>暂停</button><button id="stopToggle" data-click="stopGame()" hidden>结束本局</button><details class="stage-options"><summary>更多</summary><div><div id="difficultySetting" class="stage-difficulty" hidden><label for="difficultySelect">难度</label><select id="difficultySelect" data-change="changeDifficulty()" aria-describedby="difficultyNote"></select><p id="difficultyNote"></p></div><p id="tennisRules" class="tennis-rules" hidden></p><button data-click="startGame()">重新开始</button><button id="previewToggle" aria-pressed="false" data-click="togglePlayerView()">查看我的动作</button><button id="soundToggle" aria-pressed="false" data-click="toggleGameSound()">开启音效</button><button id="recordToggle" disabled data-click="toggleRecording()">正在读取录制状态</button><button data-click="document.documentElement.requestFullscreen?.()">全屏</button><span class="curtainActions"><button data-click="curtainCommand('open')">打开帘</button><button data-click="curtainCommand('close')">关闭帘</button></span></div></details></div>
  </div>
</main>
<footer><span id="recordState"></span><span id="gestureHint">OK 开始 · 剪刀手切换游戏 · 触发后放下手</span><a id="back" href="/" hidden>返回</a></footer>
<script defer src="/assets/game-scenes.js"></script><script defer src="/assets/ski-scene.js"></script><script defer src="/assets/game-presentation.js"></script><script defer src="/assets/game-sound.js"></script><script defer src="/assets/games.js"></script><script type="module" src="/assets/game-teaching.js"></script></body></html>
