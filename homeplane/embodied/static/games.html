<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friday · 体感游戏</title>
<link rel="stylesheet" href="/assets/games.css">
<body><header><div><h1>Friday · 体感游戏</h1><small>和家人一起动起来</small></div><nav aria-label="游戏模式"><button aria-pressed="true" data-mode="quest" data-click="chooseMode('quest')">动作闯关</button><button aria-pressed="false" data-mode="ski" data-click="chooseMode('ski')">第一人称滑雪</button><button aria-pressed="false" data-mode="tennis" data-click="chooseMode('tennis')">双人网球</button><button aria-pressed="false" data-mode="hiit" data-click="chooseMode('hiit')">HIIT 闯关</button><button aria-pressed="false" data-mode="home" data-click="chooseMode('home')">智能家居</button></nav><span class="connection" id="connection">连接检测服务</span></header>
<section class="workspace"><canvas id="world" aria-label="体感游戏画面"></canvas><div class="hud"><div><div class="eyebrow" id="chapter">山径训练 / 01</div><div class="mission" id="mission">侧平举，打开第一道门</div><div class="instruction" id="instruction">单人 · 侧平举保持 3 秒 → 双手举高 3 秒 → 完成 3 次浅蹲</div><div class="bar"><i id="progress"></i></div></div><div class="score" id="score">0 / 3<small>完成关卡</small></div></div>
<aside class="debug" aria-label="玩家画面"><header>玩家画面</header><canvas id="debugVideo" width="640" height="360"></canvas><div class="metrics" id="debugMetrics">等待实时画面</div></aside><div class="overlay" id="overlay"><h2>用身体走完这段山径</h2><p>双脚完整入镜，OK 保持 1 秒开始；Yeah 保持 1 秒切换游戏。</p><button class="primary" data-click="startGame()">开始本局</button></div><div class="bottom"><div><div class="input" id="input">让双脚与双手完整入镜</div><div class="live" id="camera">等待实时人体</div><div class="live" id="feedback"></div></div><div class="actions"><button data-click="startGame()">重新开始</button><button data-click="stopGame()">结束本局</button><span class="curtainActions"><button data-click="curtainCommand('open')">打开帘</button><button data-click="curtainCommand('close')">关闭帘</button></span><button id="recordToggle" aria-pressed="true" data-click="toggleRecording()">自动录制：开</button><button data-click="document.documentElement.requestFullscreen?.()">全屏</button></div></div></section><footer><span id="recordState">入镜后自动录制</span><span>OK 保持 1 秒开始 · Yeah 保持 1 秒切换 · 触发后先放下手</span><a id="back" href="/">座位指认</a></footer>
<script defer src="/assets/games.js"></script></body></html>
