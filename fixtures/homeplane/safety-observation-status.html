<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Friday · 跌倒观测合成示例</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/interface.css">
</head>
<body>
  <aside class="sidebar"><a class="brand" href="#">Friday</a><div class="household">示例家庭</div></aside>
  <div class="shell">
    <header class="topbar"><span class="badge">合成示例 · 未连接设备</span></header>
    <main id="workspace">
      <header class="page-header"><div><h1>家中提醒</h1></div></header>
      <section class="experience" id="content"></section>
    </main>
  </div>
  <script type="module">
    import {mountSafety} from '/static/safety.js';

    const fall_observations = [
      {name:'示例客厅',state:'pose_available'},
      {name:'示例走廊',state:'no_person_reported'},
      {name:'示例书房',state:'pose_limited',pose_gap_ms:1800},
      {name:'示例健身房',state:'observation_gap',observation_gap_ms:3100},
      {name:'示例卧室',state:'shutter_closed'},
    ];
    const status = {
      policy:{enabled:true,announce:false,visual_review:false,sound_review:false,revision:1},
      worker:{status:'running',cameras:[],recording:{state:'ready'}},
      fall_observations,
      capabilities:[],
    };
    const routes = {'/api/embodied/safety':status,'/api/embodied/safety/events':{events:[]}};
    window.fetch = async (path, options = {}) => {
      if (options.method || !Object.hasOwn(routes, path)) throw Error('合成示例只读取固定状态');
      return {ok:true,json:async()=>structuredClone(routes[path])};
    };
    mountSafety(document.getElementById('content'));
  </script>
</body>
</html>
